<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MNIST · Digit Classifier</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:    #0f0e0d;
  --ink-2:  #3a3835;
  --ink-3:  #8a8680;
  --rule:   #e2ddd8;
  --paper:  #faf8f5;
  --cream:  #f3efe9;
  --blue:   #1c4ed8;
  --red:    #dc2626;
  --green:  #15803d;
  --orange: #c2410c;
  --mono:   'DM Mono', monospace;
  --serif:  'DM Serif Display', serif;
}

html, body {
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

header {
  border-bottom: 1px solid var(--rule);
  padding: 1.5rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
h1 { font-family: var(--serif); font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; }
.meta { color: var(--ink-3); text-align: right; }

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: calc(100vh - 74px);
}

.pane { padding: 3rem 2rem; }
.pane-left { border-right: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--cream); }
.pane-right { display: flex; flex-direction: column; justify-content: flex-start; }

.pad-container { background: white; border: 1px solid var(--ink); padding: 1.5rem; box-shadow: 0 4px 0 var(--ink); margin-bottom: 2rem; }
canvas { background: #000000; display: block; cursor: crosshair; touch-action: none; }

.controls { display: flex; gap: 1rem; width: 280px; }
button {
  flex: 1;
  background: white;
  border: 1px solid var(--ink);
  padding: 0.75rem;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
  transition: all 0.1s ease;
}
button:hover { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
button.primary { background: var(--ink); color: white; }

.status-bar { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1.5rem; color: var(--ink-3); }
.status-bar span { font-weight: 500; }

.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); margin-bottom: 2rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; }

.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-bottom: 4rem; }
.hero-prediction { display: flex; flex-direction: column; align-items: flex-start; }
.digit-display { font-family: var(--serif); font-size: 8rem; line-height: 1; margin: -1rem 0 0.5rem -0.5rem; color: var(--ink); position: relative; transition: opacity 0.2s ease; }
.digit-display.idle { opacity: 0.15; }
.conf-label { font-size: 11px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.25rem; }
.conf-row { display: flex; align-items: baseline; gap: 0.5rem; width: 100%; }
.conf-value { font-weight: 500; font-size: 16px; }
.conf-meter { flex: 1; height: 4px; background: var(--rule); position: relative; top: -2px; }
.conf-bar { height: 100%; background: var(--ink); width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

.alt-list { display: flex; flex-direction: column; gap: 0.75rem; justify-content: center; }
.alt-item { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; border: 1px dashed var(--rule); }
.alt-item.winner { border-style: solid; border-color: var(--ink); background: var(--cream); }
.alt-digit { font-family: var(--serif); font-size: 1.5rem; color: var(--ink); }
.alt-conf { font-size: 11px; color: var(--ink-2); }

.distribution { display: flex; flex-direction: column; gap: 0.5rem; }
.dist-row { display: flex; align-items: center; gap: 1rem; }
.dist-label { width: 12px; font-weight: 500; color: var(--ink-2); }
.dist-track { flex: 1; height: 12px; background: var(--cream); position: relative; }
.dist-bar { height: 100%; background: var(--ink-3); width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.dist-bar.winner { background: var(--blue); }
.dist-pct { width: 45px; text-align: right; font-size: 11px; color: var(--ink-3); }
.dist-pct.winner { color: var(--blue); font-weight: 500; }

.toggle-container { margin-bottom: 1.5rem; width: 280px; display: flex; border: 1px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.toggle-btn { flex: 1; background: white; border: none; padding: 0.5rem; font-family: var(--mono); font-size: 10px; text-transform: uppercase; cursor: pointer; letter-spacing: 0.05em; }
.toggle-btn.active { background: var(--ink); color: white; }

.static-upload { display: none; width: 280px; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem; }
.file-input-label { display: block; width: 100%; background: white; border: 1px dashed var(--ink-3); padding: 2rem; text-align: center; cursor: pointer; color: var(--ink-2); }
.file-input-label:hover { background: var(--cream); }
#image-input { display: none; }
.preview-container { width: 280px; height: 280px; background: #000; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
#preview-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

@media (max-width: 768px) {
  main { grid-template-columns: 1fr; }
  .pane-left { border-right: none; border-bottom: 1px solid var(--rule); padding: 2rem 1rem; }
  .pane-right { padding: 2rem 1rem; }
}
</style>
</head>
<body>

<header>
  <h1>mnist cnn v2</h1>
  <div class="meta">digit recognition engine<br/>evaluation interface</div>
</header>

<main>
  <div class="pane pane-left">
    <div class="toggle-container">
      <button class="toggle-btn active" id="mode-draw" onclick="setMode('draw')">Draw Input</button>
      <button class="toggle-btn" id="mode-static" onclick="setMode('static')">Upload Image</button>
    </div>

    <div id="draw-zone">
      <div class="pad-container">
        <canvas id="canvas" width="280" height="280"></canvas>
      </div>
    </div>

    <div id="static-zone" class="static-upload">
      <label for="image-input" class="file-input-label" id="drop-label">
        Click to upload testing image<br/><span style="font-size:10px;color:var(--ink-3)">(PNG/JPG, auto grayscale)</span>
      </label>
      <input type="file" id="image-input" accept="image/*" onchange="handleFile(event)"/>
      <div class="preview-container">
        <img id="preview-img" alt="Inference core view" src=""/>
      </div>
    </div>

    <div class="controls">
      <button onclick="clearInput()">Clear</button>
      <button class="primary" onclick="predictImage()">Predict</button>
    </div>
    <div class="status-bar">Engine Status: <span id="status" style="color:var(--ink-2)">Ready</span></div>
  </div>

  <div class="pane pane-right">
    <div class="section-title">Inference Analysis</div>
    
    <div class="result-grid">
      <div class="hero-prediction">
        <div class="conf-label">Evaluated Output</div>
        <div class="digit-display idle" id="digit-big">?</div>
        <div class="conf-label">Confidence Profile</div>
        <div class="conf-row">
          <div class="conf-value" id="conf-value">0.0%</div>
          <div class="conf-meter"><div class="conf-bar" id="conf-bar"></div></div>
        </div>
      </div>

      <div class="alt-list">
        <div class="conf-label">Alternative Hypotheses</div>
        <div class="alt-item winner" id="alt-0">
          <span class="alt-digit">?</span><span class="alt-conf">--</span>
        </div>
        <div class="alt-item" id="alt-1">
          <span class="alt-digit">?</span><span class="alt-conf">--</span>
        </div>
        <div class="alt-item" id="alt-2">
          <span class="alt-digit">?</span><span class="alt-conf">--</span>
        </div>
      </div>
    </div>

    <div class="section-title">Probability Distribution (softmax)</div>
    <div class="distribution">
      <script>
        for(let i=0; i<10; i++){
          document.write(`
            <div class="dist-row">
              <div class="dist-label">${i}</div>
              <div class="dist-track"><div class="dist-bar" id="bar-${i}"></div></div>
              <div class="dist-pct" id="pct-${i}">0.0%</div>
            </div>
          `);
        }
      </script>
    </div>
  </div>
</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;
let isStaticImage = false;

ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 16;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startDraw(e) { isDrawing = true; draw(e); }
function stopDraw() { isDrawing = false; ctx.beginPath(); }
function draw(e) {
  if(!isDrawing || isStaticImage) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
window.addEventListener('mouseup', stopDraw);

canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', draw, {passive:false});
window.addEventListener('touchend', stopDraw);

function setMode(mode) {
  isStaticImage = (mode === 'static');
  document.getElementById('mode-draw').classList.toggle('active', mode==='draw');
  document.getElementById('mode-static').classList.toggle('active', mode==='static');
  document.getElementById('draw-zone').style.display = mode==='draw'?'block':'none';
  document.getElementById('static-zone').style.display = mode==='static'?'flex':'none';
  clearInput();
}

function handleFile(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(event){
    const img = document.getElementById('preview-img');
    img.src = event.target.result;
    document.getElementById('drop-label').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearInput() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  document.getElementById('preview-img').src = '';
  document.getElementById('image-input').value = '';
  document.getElementById('drop-label').style.display = 'block';
  
  const d = document.getElementById('digit-big');
  d.textContent = '?'; d.classList.add('idle');
  document.getElementById('conf-value').textContent = '0.0%';
  document.getElementById('conf-bar').style.width = '0%';
  
  for(let i=0; i<3; i++){
    const c = document.getElementById(`alt-${i}`);
    c.querySelector('.alt-digit').textContent = '?';
    c.querySelector('.alt-conf').textContent = '--';
    c.classList.toggle('winner', i===0);
  }
  for(let i=0; i<10; i++){
    document.getElementById(`bar-${i}`).style.width = '0%';
    document.getElementById(`bar-${i}`).classList.remove('winner');
    document.getElementById(`pct-${i}`).textContent = '0.0%';
    document.getElementById(`pct-${i}`).classList.remove('winner');
  }
  setStatus('Ready', 'green');
}

function setStatus(txt, colorVar) {
  const s = document.getElementById('status');
  s.textContent = txt;
  s.style.color = `var(--${colorVar})`;
}

async function predictImage() {
  if (isStaticImage && !document.getElementById('preview-img').src) return;

  const base64Data = isStaticImage 
    ? document.getElementById('preview-img').src 
    : canvas.toDataURL('image/png');

  setStatus('Analyzing...', 'blue');

  try {
    // FIX: Targets Render automatically instead of broken localhost port 5000
    const response = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64Data })
    });

    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    const data = await response.json();

    if (data.preview) document.getElementById('preview-img').src = data.preview;

    const d = document.getElementById('digit-big');
    d.textContent = data.digit; d.classList.remove('idle');

    const cv = document.getElementById('conf-value');
    cv.textContent = data.confidence.toFixed(1)+'%';
    cv.style.color = data.confidence>=80?'var(--green)':data.confidence>=50?'var(--orange)':'var(--red)';
    document.getElementById('conf-bar').style.width = data.confidence+'%';

    if (data.top3) data.top3.forEach((item,i)=>{
      const c=document.getElementById(`alt-${i}`);
      if (c) {
        c.querySelector('.alt-digit').textContent=item.digit;
        c.querySelector('.alt-conf').textContent=item.conf.toFixed(1)+'%';
        c.classList.toggle('winner',i===0);
      }
    });

    if (data.probs) data.probs.forEach((p,i)=>{
      const b=document.getElementById(`bar-${i}`), pt=document.getElementById(`pct-${i}`);
      if (b) b.style.width=p+'%'; 
      if (pt) pt.textContent=p.toFixed(1)+'%';
      if (b) b.classList.toggle('winner',i===data.digit);
      if (pt) pt.classList.toggle('winner',i===data.digit);
    });

    setStatus('Ready', 'green');
  } catch (err) {
    console.error(err);
    setStatus('Network error — is the server running?', 'red');
  }
}

clearInput();
</script>
</body>
</html>
